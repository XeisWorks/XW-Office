name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,invoice-collection]"
      - name: Ruff
        run: ruff check src/
      - name: Pytest
        run: pytest tests/ -v
      - name: mypy (type check)
        run: mypy src/
