  depends_on:
  - P00
  tasks:
  - id: T03
    title: Hub-API für Desktop-Verbraucher ergänzen
    status: pending
    depends_on_tasks:
    - T02
    implementation:
    - Bestehende Repositories/Services verwenden; fehlende Leseverträge für Druckprofile und Varianten ergänzen
    - Versionierte DTOs und authentifizierten Desktop-Client bauen
    acceptance:
    - Web und Desktop liefern gleiche Produkt-UUIDs und Preise; kein Desktop-Providerwrite
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
  - id: T04
    title: Migration und Desktop-Umschaltung
    status: pending
    depends_on_tasks:
    - T03
    implementation:
    - Freigegebene eindeutige Zuordnungen additiv migrieren; Legacy-Snapshot erhalten
    - PRODUKTE startet gemeinsame WebUI; native Druckaktionen über Hub-ID; alten schreibenden Katalog deaktivieren
    acceptance:
    - Shadow-Vergleich dokumentiert; Druck-/Bestandsfunktion erhalten; Rollback reaktiviert keine Doppelpflege
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
