    - Draft-Autosave mit row_version; atomare SKU-Prüfung; Produktoptionen und selektierte Kombinationen
    acceptance:
    - Refresh/Gerätewechsel setzt fort; konkurrierende Änderung liefert Konflikt; eigene Preise je Variante
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
  - id: T06
    title: Vorlagen und Kopieren
    status: pending
    depends_on_tasks:
