    - Wix-/sevDesk-Editorlinks anhand echter IDs verifizieren; Übersichts-Fallback
    acceptance:
    - KI-Fehler verliert keine Eingaben; Übernahme separat; Editor öffnet richtiges Produkt; kein Social-Autopost
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
