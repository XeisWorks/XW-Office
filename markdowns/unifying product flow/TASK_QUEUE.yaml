schema_version: 1
project: XW-Office unified product workflow
language: de-AT
execution: one task at a time
baseline_commit: aff6b85e54be3a5fb7eed88812225ec702ed3084
status: in_progress
rules:
- Reuse existing Product Hub, outbox, conflict wizard, Graph and OpenAI services
- Do not modify protected architecture archive
- No production provider writes during automated tests
- No silent substitution of fonts, PDFs, IDs or API capabilities
- Record actual tests, commit and remaining blockers in PROGRESS.md
phases:
- id: P00
  title: Bestand und Verträge
  depends_on: []
  tasks:
  - id: T01
    title: Iststand und Verbraucher erfassen
    status: done
    depends_on_tasks: []
    implementation:
    - AGENTS.md lesen; main sauber aktualisieren; BUILD_PLAN-Codepfade und aktuellen Alembic-Head prüfen
    - Settings/Hub/Druck/Inventory/Graph/OpenAI-Verbraucher und reale Deploymentkonfiguration dokumentieren
    acceptance:
    - CURRENT_STATE.md mit belegten Einstiegspunkten; keine Produktwrites
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
  - id: T02
    title: Migration als Vorschau planen
    status: in_progress
    depends_on_tasks:
    - T01
    implementation:
    - Settings-Produkte auf Hub-UUIDs/Varianten/Aliase matchen; Konflikte und fehlende Druckpfade listen
    - Backup-/Rollback-Verfahren und Schreibsperre für Legacy definieren
    acceptance:
    - Report erhält sämtliche Druck-/Aliaszuordnungen; mehrdeutige Treffer bleiben offen
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
- id: P01
