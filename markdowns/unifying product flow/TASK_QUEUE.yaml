    - Kopie verändert Original nicht; Vorschlags-SKU bleibt editierbar
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
  - id: T07
    title: Gemeinsame Wizard-Oberfläche
    status: pending
    depends_on_tasks:
    - T06
    implementation:
    - Schritte 0–7 aus BUILD_PLAN; kanalabhängige Validierung
    - Native Hülle mit sicherer Navigation und Systembrowser-Fallback; keine Tokens in URLs
