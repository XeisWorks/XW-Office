    - Digital-Datei und Inventar getrennt prüfen; Readback jedes bestätigten Felds
    acceptance:
    - Cabernet-Option Besetzung mit zwei SKU/Preisen/Covern; Wix standardmäßig verborgen; V1 digital erklärt blockiert
    rollback: Disable new path via feature flag; retain data and read-only legacy snapshot; never restore dual writes.
