rasterization:
  reference_height_px: 1000
  virtual_dpi: 96
  template_calibration: 1.0
  require_reference_comparison: true
  fit_both_width_and_height: true
  bbox_offset_aware: true
  silent_font_fallback: false
text_styles:
  composer:
    # The legacy request called this "Book Antiqua". BOOKOS.TTF was verified
    # by embedded metadata as Bookman Old Style; use that real family name so
    # the private renderer can remain fail-closed instead of guessing by file name.
    family: Bookman Old Style
    size_pt: 14.3
    color: '#4b4b4b'
  title:
    family: Deneane
    size_pt: 36
    color: '#000000'
    max_lines: 3
    proposed_size_pt_by_lines:
      1: 36
      2: 31
      3: 26
    minimum_size_pt_proposed: 18
    manual_newlines: true
    overflow: block_export_with_explanation
  arrangement_label:
    text: 'Arrangement:'
    family: Bookman Old Style
    size_pt: 11.5
    color: '#4b4b4b'
    small_caps: true
    underline: true
  arranger:
    family: Bookman Old Style
    size_pt: 12.5
    color: '#4b4b4b'
  edition:
    family: Bookman Old Style
    size_pt: 12
    color: '#ffffff'
    small_caps: true
fonts:
  source: private_runtime_font_directory
  verify_font_family_metadata: true
  do_not_commit_font_binaries: true
  small_caps: OpenType features where supported; otherwise controlled glyph-size rendering
  missing: draft_allowed_export_blocked
validation_cases:
- 1 line short title
- 2 lines Cabernet / Polka
- 3 lines long title
- umlauts and apostrophes
- long composer and arranger
- missing fonts
- no added card or black bar
- same anchors for each background
