# Verbindliche Implementierungs-Queue. Status nur mit `evidence` auf done setzen.
schema_version: 2
plan_id: "xw-office-expense-invoice-collector-2026-11"
state: "in_progress"
repo: "XeisWorks/XW-Office"
target_branch: "main"
entry_point: "Finanzen > Ausgabenprüfung"
strategy: "ports_and_adapters_manual_vertical_slice_then_mail_api_browser"
max_required_extra_subscriptions: 0
current_status:
  implemented:
    - "manual import through PDF pipeline and OneDriveLocalSink"
    - "provider-independent dialog, connection metadata and bounded orchestrator"
    - "current Europe/Vienna month defaults and selected DateRange forwarding to connector factories"
    - "route-local discovery failure isolation, connection-ID locks and connector cleanup"
    - "planned routes blocked both at save time and when loading existing connections"
    - "Graph mail factory wired into desktop dialog with mailbox and sender-domain settings"
    - "explicit delegated Graph mailbox probe using minimal Mail.Read and one-message-ID query"
    - "collection table reports provider/account/route/tenant and per-candidate result without external IDs"
    - "empty discovery is distinct from successful document processing"
    - "Graph mail, Mollie API and Playwright adapter contracts covered with local fakes"
  not_live_verified:
    - "all 18 real provider accounts and 26 route behaviors; mailbox probe is not invoice-route verification"
    - "invoice-date extraction and unknown-date review for Graph mail attachments"
    - "remote OneDrive cloud confirmation"
    - "see PROVIDER_ABDECKUNG_2026-11-14.md for provider-by-provider relevance and next proof"

mvp_scope:
  required:
    - "provider-independent domain, registry and local connections"
    - "secure LOCALAPPDATA state and secret references"
    - "PDF pipeline, journal and OneDrive local-sync sink"
    - "manual import vertical slice"
    - "provider-independent dialog and bounded orchestrator"
    - "Graph mail attachment connector with secure UI auth"
    - "Mollie invoices.read connector with mocks"
    - "Playwright engine with local fake portal, login/resume and download"
  explicitly_not_required_for_mvp:
    - "all listed live providers automated"
    - "Graph Drive upload"
    - "multi-PC concurrent collection"
    - "scheduler or Windows service"
    - "automatic sevDesk booking"

human_intervention_only:
  - "initial_portal_login_or_2fa"
  - "onedrive_folder_selection"
  - "microsoft_entra_consent"
  - "enter_minimal_read_credential_in_local_secure_ui"

coding_rules:
  - "Read AGENTS.md and current code/tests before each implementation phase."
  - "Preserve existing expense review, sevDesk, XW-Flow, Graph mail and Product Hub behavior."
  - "Keep UI, orchestrator, pipeline and sinks free of provider-id conditionals."
  - "Connectors return candidates/artifacts and never write to the archive sink."
  - "Registry contains no secrets and no executable Python import paths."
  - "Do not assume live URLs, DOM locators, sender rules or APIs without tests."
  - "Do not request passwords, OTPs, recovery codes or API secrets in chat."
  - "Never mark an unverified route as automated or cloud-verified."
  - "Commit and push tested progress according to AGENTS.md; never force-push main."

status_policy:
  allowed: ["todo", "in_progress", "blocked_external", "done"]
  done_requires:
    - "all acceptance items satisfied"
    - "tests listed in evidence"
    - "no unresolved security finding in task scope"
  blocked_external_requires:
    - "exact missing user/external action documented without secret value"

tasks:
  - id: "T00"
    title: "Ist-Zustand und Baseline festhalten"
    priority: 0
    status: "todo"
    depends_on: []
    evidence: []
    deliverables:
      - "Architecture diff against current repo and affected-file map"
      - "Baseline results for expense, worker, secret and Graph mail tests"
      - "Document current repo-local state/log paths and Graph cache/scopes"
    acceptance:
      - "Both tenants and current expense-review lifecycle are covered"
      - "Existing Graph token cache and SecretService behavior are evidenced"
      - "No feature code changed before baseline is captured"

  - id: "T01"
    title: "Domain, Ports und Registry-Schema"
    priority: 1
    status: "in_progress"
    depends_on: ["T00"]
    evidence:
      - "src/xw_office/services/invoice_collection/domain.py"
      - "src/xw_office/services/invoice_collection/ports.py"
      - "src/xw_office/services/invoice_collection/registry.py"
      - "src/xw_office/services/invoice_collection/factories.py"
      - "tests/unit/test_invoice_collection_foundations.py"
    deliverables:
      - "Immutable domain types and separate configuration/auth/run/document/sync states"
      - "Connector, DocumentSink, SecretStore, Journal, Clock and CancelToken protocols"
      - "Provider catalog v2 parser/validator and explicit connector factory registry"
      - "ProviderConnection model separated from provider manifests"
    acceptance:
      - "Unknown schema/tenant/document type fails with actionable configuration error"
      - "A planned route may remain unavailable; enabling it requires a registered connector factory"
      - "Catalog accepts no secret values or executable import paths"
      - "No provider-specific branch exists in UI/orchestrator/pipeline/sink"
      - "Registry YAML parses and all provider/route IDs are unique"

  - id: "T02"
    title: "Lokale Sicherheits- und Zustandsbasis"
    priority: 2
    status: "in_progress"
    depends_on: ["T01"]
    evidence:
      - "src/xw_office/core/app_paths.py::local_app_data_dir"
      - "src/xw_office/services/invoice_collection/security.py"
      - "src/xw_office/services/invoice_collection/journal.py"
      - ".gitignore"
      - "tests/unit/test_invoice_collection_foundations.py"
    deliverables:
      - "Tested LOCALAPPDATA path helper for profiles, auth, journal, tmp and quarantine"
      - "Gitignore hardening as defense in depth"
      - "SecretRef plus Windows keyring adapter and redaction-safe errors"
      - "Versioned local SQLite journal with migrations and crash-safe transactions"
      - "Account/profile lock abstraction and Windows user ACL handling"
    acceptance:
      - "No new state, profile, token cache or PDF is created below repo/state"
      - "Database contains secret references only"
      - "Logs and repr never expose test tokens, cookies, signed URLs or full user paths"
      - "Existing SecretService tests remain green"

  - id: "T03"
    title: "PDF-Pipeline, OneDrive-Sink und manueller vertikaler Slice"
    priority: 3
    status: "in_progress"
    depends_on: ["T02"]
    evidence:
      - "src/xw_office/services/invoice_collection/pdf_validation.py"
      - "src/xw_office/services/invoice_collection/pipeline.py"
      - "src/xw_office/services/invoice_collection/sinks/onedrive_local.py"
      - "src/xw_office/services/invoice_collection/connectors/manual_import.py"
      - "tests/unit/test_invoice_collection_foundations.py"
    deliverables:
      - "PDF size/signature/MIME/parser/encryption validation"
      - "SHA-256, deterministic safe naming and tenant-scoped deduplication"
      - "OneDriveLocalSink with preflight, no-clobber publish and truthful sync state"
      - "ManualImportConnector through the same pipeline and journal"
      - "Conflict/quarantine handling and workspace cleanup/recovery"
    acceptance:
      - "Repeated import creates no duplicate"
      - "Same external ID with different hash becomes CONTENT_CONFLICT"
      - "Same hash in another tenant is not silently suppressed"
      - "HTML/empty/corrupt/encrypted/oversized PDF cases are tested"
      - "Local save never emits CLOUD_VERIFIED"
      - "Concurrent identical target and divergent target cases are tested"

  - id: "T04"
    title: "Provider-unabhängiger Dialog und Orchestrator"
    priority: 4
    status: "in_progress"
    depends_on: ["T03"]
    evidence:
      - "src/xw_office/ui/modules/expense_review/invoice_collector_dialog.py"
      - "src/xw_office/services/invoice_collection/orchestrator.py"
      - "tests/ui/test_invoice_collector_dialog.py"
      - "tests/ui/test_invoice_collector_dialog.py::test_invoice_collector_dialog_refuses_to_enable_unverified_route"
      - "tests/unit/test_invoice_collection_foundations.py::test_collection_service_blocks_saved_route_that_catalog_marks_planned"
      - "tests/unit/test_invoice_collection_foundations.py::test_orchestrator_honors_cooperative_cancellation_before_start"
      - "tests/unit/test_invoice_collection_foundations.py::test_orchestrator_isolates_discovery_failure_and_uses_connection_lock"
      - "tests/unit/test_invoice_collection_foundations.py::test_collection_service_wires_saved_routes_to_factory_and_orchestrator (period forwarding)"
      - "tests/unit/test_invoice_collection_foundations.py::test_orchestrator_reports_empty_route_without_source_identifiers"
      - "tests/ui/test_expense_review_view.py"
      - "tests/ui/test_invoice_collector_dialog.py::test_collection_results_show_route_outcomes_without_external_ids"
      - "tests/ui/test_invoice_collector_dialog.py::test_collection_results_distinguish_empty_route_from_success"
    deliverables:
      - "Additional text button in ExpenseReviewView"
      - "InvoiceCollectorDialog generated from manifests, connections, capabilities and states"
      - "Connection setup for provider, tenant, account alias, routes and target"
      - "Bounded run queue, per-account lock, progress, partial result and cooperative cancel"
      - "Capability-driven auth/import/open/retry actions"
    acceptance:
      - "Existing refresh, filters, tenant tabs, settings and supplier URLs remain unaffected"
      - "One failed connection does not abort others"
      - "View destruction and cancellation do not leak QThreads or apply stale results"
      - "Adding a fixture provider requires no dialog/orchestrator code change"
      - "Manual import works end-to-end from UI to sink"

  - id: "T05"
    title: "Microsoft-Graph-Mailroute"
    priority: 5
    status: "in_progress"
    depends_on: ["T02", "T03", "T04"]
    parallelizable_with: ["T06", "T07"]
    evidence:
      - "src/xw_office/services/invoice_collection/bootstrap.py::build_connector_factories"
      - "src/xw_office/services/invoice_collection/auth/graph.py"
      - "src/xw_office/services/invoice_collection/connectors/graph_reader.py"
      - "src/xw_office/services/invoice_collection/connectors/graph_mail.py"
      - "src/xw_office/services/invoice_collection/connectors/graph_reader.py::probe_mailbox"
      - "tests/unit/test_invoice_collection_connectors.py"
      - "tests/unit/test_invoice_collection_connectors.py::test_graph_mail_connector_fails_closed_without_verified_sender_domains"
      - "tests/unit/test_invoice_collection_connectors.py::test_graph_mail_factory_wires_local_connection_settings_and_selected_period"
      - "tests/unit/test_invoice_collection_connectors.py::test_graph_reader_mailbox_probe_reads_only_one_message_id"
      - "src/xw_office/ui/modules/expense_review/invoice_collector_dialog.py::_test_mailbox_access"
    deliverables:
      - "UI-visible delegated sign-in with minimal required mail scopes"
      - "DPAPI-protected MSAL cache outside repo and migration/reauth decision"
      - "Generic Graph attachment discovery/download with pagination and checkpoints"
      - "Validated provider matcher config for sender domain, alias and attachment"
    acceptance:
      - "Mock messages cover pagination, shared-mailbox option, PDF and non-PDF attachment"
      - "Notification mail without PDF does not become a document"
      - "Mail links are not followed"
      - "Checkpoint advances only after successful pipeline processing"
      - "Existing GraphMailClient behavior/tests remain compatible"

  - id: "T06"
    title: "Mollie-Invoices-API-Route"
    priority: 6
    status: "in_progress"
    depends_on: ["T02", "T03", "T04"]
    parallelizable_with: ["T05", "T07"]
    evidence:
      - "src/xw_office/services/invoice_collection/connectors/mollie_invoices.py"
      - "tests/unit/test_invoice_collection_connectors.py"
    deliverables:
      - "Dedicated SecretRef for minimal invoices.read credential"
      - "Paginated list/get/download connector with host/redirect policy"
      - "Timeout, Retry-After, bounded retry and typed/redacted errors"
      - "Fee-document metadata distinct from customer invoices"
    acceptance:
      - "Mock API covers multiple pages, 401, 403, 429, timeout, redirect and invalid PDF"
      - "Connector never receives a sink or archive path"
      - "Duplicate via API and mail merges provenance without second file"
      - "No payment-capable token is assumed or requested"

  - id: "T07"
    title: "Playwright-Engine und Fake-Portal"
    priority: 7
    status: "in_progress"
    depends_on: ["T02", "T03", "T04"]
    parallelizable_with: ["T05", "T06"]
    evidence:
      - "src/xw_office/services/invoice_collection/playwright_session.py"
      - "src/xw_office/services/invoice_collection/connectors/browser.py"
      - "tests/unit/test_invoice_collection_connectors.py"
    deliverables:
      - "Optional Playwright dependency and documented Chromium installation"
      - "Persistent profile per connection plus exclusive process lock"
      - "Headful login/renew, protected-page probe and route-specific resume token"
      - "expect_download/save_as implementation"
      - "Local fake portal for expired session, login, 2FA wait simulation and PDF download"
    acceptance:
      - "Core/manual/mail/API modules import without Playwright installed"
      - "Expired session yields NEEDS_LOGIN without password prompt"
      - "Successful login resumes only the waiting connection/route"
      - "Cancellation, timeout and provider DOM change produce typed results"
      - "No stealth, CAPTCHA bypass, private API or cookie-header reconstruction"

  - id: "T08"
    title: "Erste reale Routen kontrolliert verifizieren"
    priority: 8
    status: "todo"
    depends_on: ["T05", "T06", "T07"]
    evidence: []
    deliverables:
      - "Verification report per tested route and account type"
      - "At least one real mail route assessed"
      - "Mollie invoices.read assessed if entitlement/token is available"
      - "At most one real browser pilot before broader rollout"
      - "Unverified routes remain planned/manual"
    acceptance:
      - "Each verified route has real document type, download and idempotent rerun evidence"
      - "Auth expiry/invalid credential behavior is evidenced"
      - "Blocked automation becomes POLICY_BLOCKED or manual, not a bypass attempt"
      - "No personal evidence, PDF or credential is committed"
    external_blockers_allowed:
      - "missing real invoice in selected period"
      - "missing API entitlement"
      - "user login, 2FA or Entra consent not yet completed"

  - id: "T09"
    title: "MVP-Sicherheits-, Regressions- und Releaseprüfung"
    priority: 9
    status: "todo"
    depends_on: ["T05", "T06", "T07"]
    evidence: []
    deliverables:
      - "Unit, contract, UI and integration test report"
      - "Ruff, git diff --check, YAML validation and secret scan"
      - "Beginner setup, provider coverage matrix and known limitations"
      - "Clean main commit pushed to origin/main"
    acceptance:
      - "MVP required scope is complete or an exact blocker is documented"
      - "Existing expense review regression is green for both tenants"
      - "No secrets, PDFs, profiles, OAuth caches or sensitive logs in Git/artifacts"
      - "Partial failures, offline/unwritable target, invalid PDF and duplicates are covered"
      - "All live-unverified routes are still planned/experimental, never verified"
      - "Working tree is clean and main was not force-pushed"

  - id: "T10"
    title: "Weitere Provider in unabhängigen Verifikationswellen"
    priority: 10
    status: "todo"
    depends_on: ["T09"]
    evidence:
      - "markdowns/rechnungsautomat_ausgabenpruefung_2026-11/PROVIDER_ABDECKUNG_2026-11-14.md"
      - "markdowns/rechnungsautomat_ausgabenpruefung_2026-11/PROVIDER_REGISTRY.yaml (BrowserStack, Figma, Slack, CodeScene)"
    deliverables:
      - "One small provider/route batch per change set"
      - "Coverage report for BrowserStack, Anthropic, Google Cloud, Stripe, Railway, GitHub, Perplexity, OpenAI, Google AI, Microsoft 365 and Amazon Business"
      - "Income-evidence review for AdSense/YouTube isolated from expenses"
      - "Amazon invoice-fetcher parity report before any cancellation"
    acceptance:
      - "Shared ports/contract tests are reused for every new connector"
      - "UI/orchestrator/pipeline/sink stay provider-independent"
      - "Every maturity change has route-specific evidence"
      - "Provider batches can ship independently; one blocked portal does not block others"

quality_gates:
  before_live_login:
    - "T02 acceptance passed"
    - "Host allowlist and redaction tests passed for the route"
    - "Explicit user action requested only in the local UI"
  before_route_verified:
    - "All registry verification_requirements evidenced"
    - "No unauthorized login automation"
    - "Document type and tenant mapping manually confirmed"
  release:
    - "Automated acceptance tests green or exact blockers documented"
    - "No cloud-success claim without remote proof"
    - "No provider-specific branch outside connector/manifest"
    - "Repository rules from AGENTS.md satisfied"
