# Secretfreier, versionierter Provider-Katalog. Keine lokale Connection-Konfiguration.
# `maturity: verified` ist erst nach echtem Dokument + idempotentem Wiederholungstest erlaubt.
schema_version: 2
catalog_id: "xw-office-invoice-providers"
feature: "xw_office.expense_review.invoice_collection"

defaults:
  connection_enabled: false
  route_enabled: false
  route_maturity: "planned"
  manual_import_supported: true
  archive_sink: "onedrive_local_sync"
  cloud_verification: "explicit_only"

supported_tenants:
  - "xw"
  - "wuedara"

allowed_document_types:
  - "fee_invoice"
  - "expense_invoice"
  - "receipt"
  - "credit_note"
  - "payout_statement"
  - "income_statement"
  - "unknown"

allowed_route_methods:
  - "mail"
  - "official_api"
  - "browser"
  - "manual_import"

allowed_provider_categories:
  - "expense"
  - "income_evidence"

allowed_fallback_conditions:
  - "NO_DOCUMENTS"
  - "UNSUPPORTED_ACCOUNT"

security_policy:
  secret_values_in_catalog: false
  connector_import_paths_in_catalog: false
  browser_profiles: "user_local_appdata_only"
  password_store: "os_keyring_only_if_required"
  totp_seed_storage: false
  captcha_or_mfa_bypass: false
  require_https: true
  require_host_allowlist: true
  signed_urls_in_logs: false

connector_policies:
  graph_mail_attachment:
    allowed_hosts: ["graph.microsoft.com", "login.microsoftonline.com"]
    links_from_messages: "never_follow"
  manual_import:
    network_access: false

deduplication:
  scope: "tenant_and_sink"
  primary_key: "sha256"
  secondary_key: "connection_route_external_id"
  same_external_id_different_hash: "content_conflict"
  cross_route_provenance_merge: true

verification_requirements: &verification_requirements
  - "real_document_type_confirmed"
  - "real_download_confirmed"
  - "idempotent_repeat_confirmed"
  - "auth_expiry_or_invalid_credential_confirmed"
  - "sensitive_log_review_passed"

providers:
  - id: "mollie_fees"
    manifest_version: 1
    label: "Mollie – eigene Gebührenrechnungen"
    category: "expense"
    supported_tenants: ["xw", "wuedara"]
    document_types: ["fee_invoice", "credit_note"]
    portal_hosts: ["mollie.com", "my.mollie.com"]
    manual_import_supported: true
    guidance: >-
      Eigene Mollie-Gebührenbelege, nicht Kundenrechnungen oder Zahlungsobjekte. E-Mail-PDF
      bevorzugen, wenn für das konkrete Konto vollständig verifiziert.
    routes:
      - id: "mail_pdf"
        method: "mail"
        connector: "graph_mail_attachment"
        priority: 10
        maturity: "planned"
        auth: "microsoft_graph_mail"
        matching_policy: "requires_verified_sender_and_attachment_fixture"
        fallback_on: ["NO_DOCUMENTS", "UNSUPPORTED_ACCOUNT"]
        verification: *verification_requirements
      - id: "invoices_api"
        method: "official_api"
        connector: "mollie_invoices_v2"
        priority: 20
        maturity: "planned"
        auth: "api_token"
        required_scope: "invoices.read"
        credential_purpose: "invoice_read"
        allowed_hosts: ["api.mollie.com"]
        fallback_on: ["UNSUPPORTED_ACCOUNT"]
        verification: *verification_requirements
    official_docs:
      - "https://help.mollie.com/hc/en-us/articles/213179885-Where-can-I-find-my-invoice"
      - "https://docs.mollie.com/reference/list-invoices"
      - "https://docs.mollie.com/reference/get-invoice"

