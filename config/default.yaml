app:
  name: "XeisWorks Office"
  theme: "dark_gold"
  language: "de"
  window:
    width: 1600
    height: 1000
    remember_geometry: true
  sidebar:
    default_collapsed: false
    width_expanded: 220
    width_collapsed: 60

sevdesk:
  base_url: "https://my.sevdesk.de/api/v1"
  rate_limit:
    requests_per_second: 2
    cooldown_seconds: 5
  cache_ttl_seconds: 180
  http_max_retries: 3
  http_retry_backoff_seconds: 0.75

wix:
  base_url_v1: "https://www.wixapis.com/stores/v1"
  base_url_v3: "https://www.wixapis.com/stores/v3"

finanzonline:
  wsdl_url: ""
  operation_name: "submitUva"
  session_wsdl_url: "https://finanzonline.bmf.gv.at/fonws/ws/sessionService.wsdl"
  upload_wsdl_url: "https://finanzonline.bmf.gv.at/fon/ws/fileuploadService.wsdl"
  fastnr: ""
  hersteller_id: ""
  u30_xsd_path: ""
  u13_xsd_path: ""
  test_mode: true
  submit_timeout_seconds: 30

printing:
  music_dpi: 600
  invoice_dpi: 300
  buffer_quantity: 3
  rate_limit_seconds: 1
  invoice_printer: "Rechnungen"
  label_printer: "Brother QL-800"
  label_model: "QL-800"
  label_size: "62"
  label_template_path: "../sevDesk/XeisWorks - Versand_v2.lbx"
  # Printer names that are considered valid targets (Windows names, exact match).
  # Migrated from old sevDesk-project print_profiles + extra_printers.
  configured_printer_names:
    - "Rechnungen"
    - "Noten A4 Simplex"
    - "Noten A4 Duplex"
    - "Noten A5"
    - "Canon Broschüre Mono"
    - "Canon Broschüre Duo"
    - "Brother QL-800"
    - "Paketmarke A5"
    - "Zollformular"
    - "Zollformular XW 100"
  # Named print profiles: map a logical role to a specific printer + DPI.
  # Use profile "id" when calling print_pdf() via product print rules.
  print_profiles:
    - id: "invoice"
      label: "Rechnungsdruck"
      printer_name: "Rechnungen"
    - id: "label"
      label: "Etikettendruck"
      printer_name: "Brother QL-800"
    - id: "plc_label"
      label: "PLC-Labeldruck"
      printer_name: "Paketmarke A5"
      page_size: "A5"
      orientation: "portrait"
      # PLC already returns a real A5 page. Paper origin preserves its native
      # 100x200 geometry; printable origin would add the Brother margin twice.
      placement_mode: "paper_origin"
      scale_mode: "none"
      alignment: "center"
    - id: "plc_customs"
      label: "PLC-Zollformular"
      printer_name: "Zollformular XW 100"
      page_size: "A5"
      orientation: "portrait"
      placement_mode: "paper_origin"
      scale_mode: "fit"
      scale_percent: 100
      alignment: "top_left"
    - id: "noten_simplex"
      label: "Noten A4 Simplex"
      printer_name: "Noten A4 Simplex"
      backend: "pdf_xchange"
      native_pdf_exe: "C:/Program Files/PDF-XChange/PDF Editor/PXCEditor.exe"
    - id: "noten_duplex"
      label: "Noten A4 Duplex"
      printer_name: "Noten A4 Duplex"
      backend: "pdf_xchange"
      native_pdf_exe: "C:/Program Files/PDF-XChange/PDF Editor/PXCEditor.exe"
    - id: "noten_a5"
      label: "Noten A5"
      printer_name: "Noten A5"
      backend: "pdf_xchange"
      native_pdf_exe: "C:/Program Files/PDF-XChange/PDF Editor/PXCEditor.exe"
      rotate_degrees: 90
      normalize_page_size: "A5"
      max_upscale_percent: 110
    - id: "brochure_mono"
      label: "Canon Broschüre Mono"
      printer_name: "Canon Broschüre Mono"
      backend: "pdf_xchange"
      native_pdf_exe: "C:/Program Files/PDF-XChange/PDF Editor/PXCEditor.exe"
    - id: "brochure_duo"
      label: "Canon Broschüre Duo"
      printer_name: "Canon Broschüre Duo"
      backend: "pdf_xchange"
      native_pdf_exe: "C:/Program Files/PDF-XChange/PDF Editor/PXCEditor.exe"

inventory:
  alarm_threshold: 5
  auto_sync_on_start: true

crm:
  fuzzy_match_threshold: 75
  duplicate_scan_on_sync: true
  merge_loser_policy: "delete_if_empty"

clearing:
  sepa_lookback_days: 45
  b2b_year_prefixes: ["24", "25", "26", "27"]

sku_rules:
  print_prefixes: ["XW-4", "XW-6", "XW-7"]
  unreleased_prefixes: ["XW-600"]
  # Legacy convention: reference starting with "1" = B2B, "2" = B2C.
  b2b_reference_prefixes: ["1"]
  b2c_reference_prefixes: ["2"]

customer_aftercare:
  enabled: true
  ai:
    enabled: true
    min_confidence_for_prefill: 0.75
  b2b:
    wait_for_next_order: true
    max_wait_days: 20
  courtesy:
    default_enabled: true
    product_discount_percent: 30
    shipping_discount_percent: 100
  polling:
    inbox_seconds: 300
    due_check_seconds: 60
    wix_order_check_seconds: 60
